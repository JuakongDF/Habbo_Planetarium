name: Legacy packed-state Sun preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install astronomy dependencies
        run: python -m pip install -r controller/requirements.txt
      - name: Download reference ephemeris
        run: curl --fail --location --retry 3 --max-time 180 https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp --output "$RUNNER_TEMP/de440s.bsp"
      - name: Preview legacy packed state without room access
        run: python controller/realtime.py --config controller/config.habbo-es.json --ephemeris "$RUNNER_TEMP/de440s.bsp"
