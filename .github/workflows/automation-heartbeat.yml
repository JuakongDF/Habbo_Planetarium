name: Keep scheduled workflows active

on:
  schedule:
    - cron: '13 5 1,25 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Update automation activity log branch
        run: |
          if git ls-remote --exit-code --heads origin automation-heartbeat >/dev/null; then
            git fetch origin automation-heartbeat
            git checkout -B automation-heartbeat FETCH_HEAD
          else
            git checkout --orphan automation-heartbeat
            git rm -rf --quiet . || true
          fi
          mkdir -p .automation
          date -u '+%Y-%m-%dT%H:%M:%SZ' >> .automation/heartbeat.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .automation/heartbeat.log
          git commit -m 'chore: keep scheduled workflows active'
          git push origin automation-heartbeat
