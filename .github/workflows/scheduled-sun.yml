name: Scheduled Sun and Moon controller

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview both bodies or run the live controller
        type: choice
        required: true
        default: preview
        options:
          - preview
          - live
      duration_minutes:
        description: Bounded live run length
        type: number
        required: true
        default: 10

permissions:
  contents: read

concurrency:
  group: habbo-room-126070270
  cancel-in-progress: true

jobs:
  sun:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install ephemeris library
        run: python -m pip install -r controller/requirements.txt
      - name: Download JPL DE440s
        run: curl --fail --location --retry 3 --max-time 180 https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp --output "$RUNNER_TEMP/de440s.bsp"
      - name: Run scheduled controller
        if: github.event_name == 'schedule'
        env:
          HABBO_READ_KEY: ${{ secrets.HABBO_READ_KEY }}
          HABBO_WRITE_KEY: ${{ secrets.HABBO_WRITE_KEY }}
        run: python controller/scheduled_sun.py --ephemeris "$RUNNER_TEMP/de440s.bsp" --duration 21300
      - name: Preview one current position
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          HABBO_READ_KEY: ${{ secrets.HABBO_READ_KEY }}
        run: python controller/scheduled_sun.py --ephemeris "$RUNNER_TEMP/de440s.bsp" --preview
      - name: Run bounded manual controller
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
        env:
          HABBO_READ_KEY: ${{ secrets.HABBO_READ_KEY }}
          HABBO_WRITE_KEY: ${{ secrets.HABBO_WRITE_KEY }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          if ! [[ "$DURATION_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "duration_minutes must be an integer" >&2
            exit 1
          fi
          duration_seconds=$((DURATION_MINUTES * 60))
          python controller/scheduled_sun.py --ephemeris "$RUNNER_TEMP/de440s.bsp" --duration "$duration_seconds"
